server:
  port: 9001

spring:
  quartz:
    job-store-type: jdbc
    # Quartz 是否自动启动
    auto-startup: true
    # 延迟 N 秒启动
    startup-delay: 10
    # 应用关闭时，是否等待定时任务执行完成。默认为 false ，建议设置为 true
    wait-for-jobs-to-complete-on-shutdown: true
    # 是否覆盖已有 Job 的配置
    overwrite-existing-jobs: false
    jdbc:
      #first set "always" to init schema, then set "never",
      #otherwise the later running instances will overwrite previous instances.
      #      initialize-schema: always
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: tomin
            instanceId: AUTO
          jobStore:
            isClustered: true
            misfireThreshold: 120000
            clusterCheckinInterval: 15000
            tablePrefix: QRTZ_
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5


